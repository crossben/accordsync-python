name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily: catches a contract change in crossben/accordsync

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The Python client against the real server (npm), alone and in a mixed fleet with TypeScript.
  interop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: interop/run.sh
        env:
          ACCORD_DATABASE_URL: postgres://accord:accord@localhost:5432/accord
          ACCORD_INTEROP_SEEDS: 1,2,3,4,5

  # The committed contract/ must match the Accord repository (golden vectors, protocol schemas).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_contract.py --check
        env:
          ACCORD_APP_DIR: accord-src
