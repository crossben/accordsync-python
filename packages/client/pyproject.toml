[project]
name = "accordsync"
version = "0.2.0"
description = "The Accord client for Python: local-first writes, background sync, conflicts and refusals."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["offline-first", "sync", "crdt", "local-first"]
dependencies = [
    "accordsync-core",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://accord.benhattab.pro"
Source = "https://github.com/crossben/accordsync-python"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accordsync"]
