[project]
name = "accordsync-fastapi"
version = "0.3.2"
description = "Accord sync server for FastAPI: router, settings and CLI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["offline-first", "sync", "crdt", "local-first"]
dependencies = [
    "accordsync-server>=0.3,<0.4",
    "fastapi>=0.115",
]

[project.urls]
Homepage = "https://accord.benhattab.pro"
Source = "https://github.com/crossben/accordsync-python"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accordsync_fastapi"]
