[project]
name = "accordsync-django"
version = "0.3.0"
description = "Accord sync server for Django: app, URLs and management commands."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["offline-first", "sync", "crdt", "local-first"]
dependencies = [
    "accordsync-server>=0.3,<0.4",
    "django>=5.1",
]

[project.urls]
Homepage = "https://accord.benhattab.pro"
Source = "https://github.com/crossben/accordsync-python"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accordsync_django"]
