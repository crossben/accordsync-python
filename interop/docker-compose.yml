# PostgreSQL for the interop tests. `./run.sh` starts it, the server, and the tests.
# Host port 55433 (the Dart interop suite uses 55432), so both can run on one machine.
name: accordsync-python-interop
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accord
      POSTGRES_PASSWORD: accord
      POSTGRES_DB: accord
    ports: ['55433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accord']
      interval: 1s
      retries: 30
